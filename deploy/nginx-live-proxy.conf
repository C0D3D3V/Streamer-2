# nginx caching proxy for live stream files (DASH / HLS segments).
#
# Deploy this on the high-bandwidth server.
# The origin serves the actual files; this proxy caches segments so each
# segment is fetched from the origin only once regardless of viewer count.
#
# To enable in the streamer, set in config.yaml:
#   app:
#     live_proxy_url: "https://$live_host:$live_port"

# ── Configuration variables ────────────────────────────────────────────────────
# Origin: the main streamer server (serves the source files).
map $uri $origin_url {
    default "https://stream.example.com";
}

# ───────────────────────────────────────────────────────────────────────────────

proxy_cache_path /var/cache/nginx/live
                 levels=1:2
                 keys_zone=live_cache:10m
                 max_size=4g
                 inactive=5m
                 use_temp_path=off;

server {
    listen 8888;
    server_name live.example.com;

    # -- Live stream files --------------------------------------------------
    location /live/ {
        proxy_pass $origin_url/live/;

        # Cache settings
        proxy_cache            live_cache;
        proxy_cache_valid      200 30s;   # segments are immutable; short TTL is enough
        proxy_cache_use_stale  updating;  # serve stale while revalidating (reduces origin hits)
        proxy_cache_lock       on;        # only one request fetches a cold segment; others wait
        proxy_cache_lock_timeout 5s;

        # Pass through range requests (some players use them for segments)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        # CORS – allow the main site to fetch segments cross-origin
        add_header Access-Control-Allow-Origin $origin_url always;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # -- Health check -------------------------------------------------------
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
